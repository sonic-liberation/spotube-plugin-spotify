  params:
    - name: format
      value: json
      type: query
    - name: id
      value: 34bc8BvPoIyXEk24bZjizQ
      type: path
  body:
    type: json
    data: |-
      {
        "deltas": [
          {
            "ops": [
              {
                "kind": "UPDATE_LIST_ATTRIBUTES",
                "updateListAttributes": {
                  "newAttributes": {
                    "values": {
                      "name": "Very new Playlist #2",
                      "description": "HAHAHAHA"
                    }
                  }
                }
              }
            ],
            "info": {
              "source": {
                "client": "WEBPLAYER"
              }
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

