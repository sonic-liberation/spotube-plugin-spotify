info:
  name: profile
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_gql_url}}"
  headers:
    - name: User-Agent
      value: "{{userAgent}}"
  body:
    type: json
    data: |-
      {
        "variables": {},
        "operationName": "profileAttributes",
        "extensions": {
          "persistedQuery": {
            "version": 1,
            "sha256Hash": "53bcb064f6cd18c23f752bc324a791194d20df612d8e1239c735144ab0399ced"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: "{{base_gql_url}}"
      method: POST
      headers:
        - name: User-Agent
          value: "{{userAgent}}"
      body:
        type: json
        data: |-
          {
            "variables": {},
            "operationName": "profileAttributes",
            "extensions": {
              "persistedQuery": {
                "version": 1,
                "sha256Hash": "53bcb064f6cd18c23f752bc324a791194d20df612d8e1239c735144ab0399ced"
              }
            }
          }
    response:
      status: 200
      statusText: OK
      body:
