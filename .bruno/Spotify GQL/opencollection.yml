opencollection: 1.0.0

info:
  name: Spotify GQL
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{access_token}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
