    - name: accept
      value: application/json
    - name: content-type
      value: application/json;charset=UTF-8
    - name: User-Agent
      value: "{{userAgent}}"
  body:
    type: json
    data: |-
      {
          "variables": {
              "offset": 0,
              "limit": 50,
              "onlyUnPlayedItems": false,
              "includedContentTypes": [
                  "ALBUM"
              ]
          },
          "operationName": "queryWhatsNewFeed",
          "extensions": {
