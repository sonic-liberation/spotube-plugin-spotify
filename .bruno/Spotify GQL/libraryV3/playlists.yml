            "version": 1,
            "sha256Hash": "973e511ca44261fda7eebac8b653155e7caee3675abb4fb110cc1b8c78b091c3"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

