                "preRelease": null,
                "profile": {
                  "biography": {
                    "text": "GRAMMY-Award winning band Twenty One Pilots have shifted music and culture as an incomparable creative force and with an ever-evolving vision. The Columbus, OH duo—Tyler Joseph and Josh Dun— have tallied over 34 billion global streams and counting, sold north of four million tickets worldwide, notched dozens of multi-Platinum certifications, and even claimed a spot in the Guinness® Book of World Records. On September 12, Twenty One Pilots unveiled their eighth studio album, Breach, which debuted at #1 on the Billboard 200 with 200k album equivalents and earned the biggest rock debut of the decade and the biggest week in vinyl sales for a rock record since tracking began in 1991. This was the band’s first #1 since 2015’s 6x-Platinum breakout LP, Blurryface, which was the first album to notch a RIAA Gold or Platinum certification for every single song, earning the same distinction shortly after for 2013’s Vessel. They also remain one of only 18 artists to earn multiple RIAA Diamond certifications with hits “Stressed Out” and “Heathens.” The band continued to dominate the charts with 2018’s Platinum-certified Trench, which featured GRAMMY-nominated track “Jumpsuit,” followed by 2021’s Scaled and Icy and 2024’s Clancy, which both marked the biggest rock debuts of their release years. Most recently, the band completed THE CLANCY TOUR: BREACH 2025, which saw them hit stadiums and amphitheatres across North America, closing with two sold-out nights at BMO Stadium in Los Angeles.",
                    "type": "AUTOBIOGRAPHY"
