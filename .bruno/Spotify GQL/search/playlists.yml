      value: "{{userAgent}}"
  body:
    type: json
    data: |-
      {
          "variables": {
              "includePreReleases": false,
              "numberOfTopResults": 20,
              "searchTerm": "twenty one pilots",
              "offset": 0,
              "limit": 30,
              "includeAudiobooks": true,
              "includeAuthors": false
