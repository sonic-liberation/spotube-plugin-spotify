    - name: accept
      value: application/json
    - name: content-type
      value: application/json;charset=UTF-8
    - name: User-Agent
      value: "{{userAgent}}"
  body:
    type: json
    data: |-
      {
          "variables": {
              "includePreReleases": false,
              "numberOfTopResults": 20,
              "searchTerm": "twenty one pilots",
              "offset": 0,
              "limit": 30,
              "includeAudiobooks": true,
              "includeAuthors": false
          },
          "operationName": "searchAlbums",
          "extensions": {
              "persistedQuery": {
                  "version": 1,
                  "sha256Hash": "a71d2c993fc98e1c880093738a55a38b57e69cc4ce5a8c113e6c5920f9513ee2"
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

